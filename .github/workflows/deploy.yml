name: Validate app and redirect legacy Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://cchndwcqxzztagpmfofq.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: sb_publishable_OYx_V5WwGrpMWmsWkJbk6w_wevBM7es
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Check overseas guide logic
        run: npm run test:overseas
      - name: Build app (Vercel is the live host)
        run: npm run build
      - name: Prepare legacy Pages redirect
        run: |
          mkdir -p pages-redirect
          cat > pages-redirect/index.html <<'HTML'
          <!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="refresh" content="0;url=https://age3-shinshohin-tool-theta.vercel.app/"><title>Age.3 商品データベース</title></head><body><a href="https://age3-shinshohin-tool-theta.vercel.app/">Age.3 商品データベースを開く</a></body></html>
          HTML
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./pages-redirect

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Validate app and redirect legacy Pages
        id: deployment
        uses: actions/deploy-pages@v4
