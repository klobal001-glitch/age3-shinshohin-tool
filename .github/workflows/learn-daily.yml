name: 学習キット 毎晩の集計

# 毎晩、前日（日本時間）の記録を集計する。AIは使わない。
# 読み取りの合鍵は deploy.yml と同じ公開用のもの（Supabase の publishable key）を使う。
#
# 予約の時刻どおりには動かない（2026年11月に4〜8時間遅れた）。そのため
# 混みやすい「ちょうど」「30分」を避けた時刻に3回予約し、前日分ができていれば2回目以降は何もしない。
# 夜のAI（Claude の定期タスク）は、これより後の 10:17（日本時間）に動く。
on:
  schedule:
    - cron: "7 15 * * *"   # 0:07（日本時間）
    - cron: "47 17 * * *"  # 2:47
    - cron: "23 20 * * *"  # 5:23
  workflow_dispatch:
    inputs:
      date:
        description: "集計する日（YYYY-MM-DD・日本時間）。空なら前日"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: learn-commit
  cancel-in-progress: false

jobs:
  aggregate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SUPABASE_URL: https://cchndwcqxzztagpmfofq.supabase.co
      SUPABASE_KEY: sb_publishable_OYx_V5WwGrpMWmsWkJbk6w_wevBM7es
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: 前日分がもうできているか
        id: done
        if: github.event_name == 'schedule'
        run: |
          y=$(TZ=Asia/Tokyo date -d yesterday +%F)
          if [ "$(jq -r .date learn/latest.json 2>/dev/null)" = "$y" ]; then echo "前日分（$y）はできています"; echo "skip=1" >> "$GITHUB_OUTPUT"; fi
      - name: 集計
        if: steps.done.outputs.skip != '1'
        run: node learn/scripts/aggregate.mjs ${{ inputs.date && format('--date {0}', inputs.date) || '' }}
      - name: 集計結果を残す
        if: steps.done.outputs.skip != '1'
        run: |
          git config user.name "learn-kit"
          git config user.email "learn-kit@users.noreply.github.com"
          git add learn/daily learn/latest.json
          if git diff --cached --quiet; then echo "変更なし"; exit 0; fi
          git commit -m "学習キット：毎晩の集計 $(jq -r .date learn/latest.json)（signal=$(jq -r .signal learn/latest.json)）"
          for i in 1 2 3 4; do git pull --rebase -q origin main && git push -q origin HEAD:main && exit 0; sleep $((2**i)); done
          exit 1
